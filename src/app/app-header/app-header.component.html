<header class="header">
  <div class="header__container">
    <a
      routerLink="/"
      class="brand"
      aria-label="Retour à l'accueil ParfumDeals"
      (click)="closeMenu()"
    >
      <img
        src="images/parfumLogo1.png"
        alt="ParfumDeals logo"
        class="brand__logo-img"
      />

      <div class="brand__text">
        <span class="brand__name">ParfumDeals</span>
        <span class="brand__tag">Parfums en promo & outlet</span>
      </div>
    </a>

    <nav class="nav nav--desktop" aria-label="Navigation principale">
      <a
        routerLink="/meilleures-affaires"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Meilleures affaires
      </a>

      <a
        routerLink="/marques"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Marques
      </a>
    </nav>

    <div class="actions actions--desktop">
      <a
        routerLink="/cart"
        class="cart-btn"
        aria-label="Voir le panier"
        (click)="closeMenu()"
      >
        <span class="cart-btn__icon">🛒</span>
        <span>Panier</span>
        <span class="cart-btn__badge">{{ cartService.count() }}</span>
      </a>
    </div>

    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Ouvrir le menu"
    >
      ☰
    </button>
  </div>

  <div class="promo-bar">
    🔥 Les meilleures affaires parfum du moment
  </div>

  <div
    class="overlay"
    *ngIf="menuOpen()"
    (click)="closeMenu()"
  ></div>

  <aside class="mobile-menu" *ngIf="menuOpen()" aria-label="Menu mobile">
    <div class="mobile-menu__top">
      <div class="mobile-menu__brand">
        <img
          src="images/parfumLogo1.png"
          alt="ParfumDeals logo"
          class="mobile-menu__brand-logo"
        />
        <div class="mobile-menu__brand-text">
          <span class="mobile-menu__title">ParfumDeals</span>
          <span class="mobile-menu__subtitle">Outlet parfums & bons plans</span>
        </div>
      </div>

      <button
        type="button"
        class="mobile-menu__close"
        (click)="closeMenu()"
        aria-label="Fermer le menu"
      >
        ✕
      </button>
    </div>

    <nav class="nav nav--mobile">
      <a routerLink="/meilleures-affaires" (click)="closeMenu()">
        <span class="nav-mobile__icon">🔥</span>
        <span>Meilleures affaires</span>
      </a>

      <a routerLink="/marques" (click)="closeMenu()">
        <span class="nav-mobile__icon">💎</span>
        <span>Marques</span>
      </a>
    </nav>

    <div class="mobile-menu__actions">
      <a
        routerLink="/cart"
        class="mobile-menu__cart"
        (click)="closeMenu()"
      >
        <div>
          <span class="mobile-menu__cart-title">Panier</span>
          <span class="mobile-menu__cart-subtitle">Voir mes produits</span>
        </div>

        <div class="mobile-menu__cart-right">
          <span class="mobile-menu__cart-badge">{{ cartService.count() }}</span>
          <span class="mobile-menu__cart-icon">🛒</span>
        </div>
      </a>
    </div>
  </aside>
</header>

<div class="header-spacer"></div>

<a
  routerLink="/cart"
  class="floating-cart"
  aria-label="Voir le panier"
  (click)="closeMenu()"
>
  <span class="floating-cart__icon">🛒</span>
  <span class="floating-cart__badge">{{ cartService.count() }}</span>
</a>
